name: Source validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract project source bundle
        run: unzip -q releases/THE_ASHEN_CROWN_UNREAL_5_8_0.8.1_SAVE_HARDENING.zip -d source
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Unreal source data and scripts
        working-directory: source/THE_ASHEN_CROWN_UNREAL_5_8
        run: |
          python Scripts/validate_project.py
          python -m py_compile Scripts/Create_StartupMap.py Scripts/validate_project.py
      - name: Check legacy browser source syntax
        working-directory: source/THE_ASHEN_CROWN_UNREAL_5_8/LegacyWebSource
        run: npm run check
      - name: Run legacy browser source tests
        working-directory: source/THE_ASHEN_CROWN_UNREAL_5_8/LegacyWebSource
        run: npm test
